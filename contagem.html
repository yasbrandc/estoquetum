<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contagem | Estoque</title>
  
  <!-- Modern Typography: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/font/lucide.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="app-background"></div>

  <main class="app-container">
    
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <i class="icon-lucide lucide-clipboard-list header-icon" style="margin-top: 4px;"></i>
        <div>
          <h1 class="header-title" style="font-size: 1.1rem; line-height: 1.3;">Terreiro de Macumba Vó Quitéria e Dona Rosa Caveira</h1>
          <p class="header-subtitle" style="margin-top: 4px;">Contagem de Inventário</p>
        </div>
      </div>
      <button class="btn-refresh" id="btnRefresh" aria-label="Atualizar dados">
        <i class="icon-lucide lucide-rotate-cw"></i>
      </button>
    </header>

    <!-- Content Area -->
    <section class="content-area">
      
      <!-- State: Loading -->
      <div id="loadingState" class="state-container">
        <div class="spinner"></div>
        <p>Buscando lista de produtos...</p>
      </div>

      <!-- State: Error -->
      <div id="errorState" class="state-container hidden">
        <i class="icon-lucide lucide-cloud-off error-icon"></i>
        <h2 class="error-title">Erro de Conexão</h2>
        <p class="error-msg" id="errorMsg">Não foi possível carregar os produtos.</p>
        <button class="btn-primary" onclick="loadData()">Tentar Novamente</button>
      </div>
      
      <!-- State: Data Ready -->
      <div id="dataView" class="hidden">
        
        <!-- Formulário Inicial da Contagem -->
        <div class="count-form">
          <div class="form-group">
            <label for="inputResponsavel">Nome do Responsável *</label>
            <div class="input-with-icon">
              <i class="icon-lucide lucide-user"></i>
              <input type="text" id="inputResponsavel" placeholder="Digite seu nome..." autocomplete="name">
            </div>
          </div>
          
          <div class="form-group">
            <label for="inputData">Data da Contagem *</label>
            <div class="input-with-icon">
              <i class="icon-lucide lucide-calendar"></i>
              <input type="date" id="inputData">
            </div>
          </div>
        </div>

        <hr class="section-divider" style="margin: 24px 0 16px 0;" />

        <!-- Filtros e Abas -->
        <div class="filters-container">
          <!-- Barra de Pesquisa -->
          <div class="input-with-icon search-bar">
            <i class="icon-lucide lucide-search"></i>
            <input type="search" id="inputSearch" placeholder="Buscar produto ou SKU...">
          </div>

          <!-- Abas Deslizantes (Chips) -->
          <div class="chips-container" id="categoryChips">
            <!-- Chips injetados aqui via JS -->
          </div>
        </div>

        <div id="productList" class="alert-list" style="padding-bottom: 60px; margin-top: 16px;">
          <!-- Itens injetados aqui -->
        </div>

      </div>

    </section>

    <!-- Floating Action Button para Salvar -->
    <div class="bottom-action-bar hidden" id="saveBar">
      <button class="btn-gigantic" id="btnSave">
        <i class="icon-lucide lucide-save"></i>
        Salvar Contagem
      </button>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <i class="icon-lucide lucide-layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="contagem.html" class="nav-item active">
        <i class="icon-lucide lucide-clipboard-list"></i>
        <span>Contagem</span>
      </a>
    </nav>
  </main>

  <!-- Overlay para carregamento do save -->
  <div id="savingOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.8); z-index:999; justify-content:center; align-items:center; flex-direction:column;">
    <div class="spinner"></div>
    <p style="font-weight:600; margin-top:16px;">Salvando dados...</p>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="contagem.js"></script>
</body>
</html>
